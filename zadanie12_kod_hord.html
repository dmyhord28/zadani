<html> 
   <body> 
     <textarea cols="90" rows="24"> 
          <html> 
         <body> 
          <div style="color:green;font-size:50px;"> 
            <script language="JavaScript"> 
              var D1_hor=prompt("D1>=D2 D1= ");  
              var G1_hor=prompt("1<=G1 G1= "); 
              var D2_hor=prompt("D2<=31 D2= ");
              var G2_hor=prompt("G2=24 G2= "); 
              var sekund; 
              var a=parseFloat(D1_hor); 
              var b=parseFloat(D2_hor); 
              var c=parseFloat(G1_hor);
              var d=parseFloat(G2_hor);
                sekund=((a-b)*24*60*60 + (c-d)*60*60); 
              document.write("Ilość sekund między dniami "+a+" i "+b+" = "+sekund+"<br>".fontsize(45)); 
                function okno_zamknij_hordiienko() 
                 { 
                   window.close() 
                 } 
              </script> 
            </div> 
          <input type="button" value="zamknij okno" onclick="okno_zamknij_hordiienko()"/> 
        </body> 
       </html>
      </textarea> 
    </body> 
</html>
