<!DOCTYPE html>   
    <head>    
    <title> Użycie fukcji </title>    
    <meta charset="utf-8">   
    </head>  
<body> 

 <div style="color:navy;font-size:50px;"> 
    <script language="JavaScript"> 

        var a=parseFloat(prompt("a=","")); 
        var b=parseFloat(prompt("b=","")); 

function suma_hor(a, b) { 
return a + b; 
} 

function roznica_hor(a, b) { 
return a - b; 
} 

function iloczyn_hor(a, b) { 
return a * b; 
} 

function kwadrat_hor(a, b) { 
return a * a + b * b; 
} 

function reszta_z_dzielenia_hor(a, b) { 
return a % b; 
} 

document.write("suma="+suma_hor(a,b)+"<br>"); 
document.write("różnica="+roznica_hor(a,b)+"<br>"); 
document.write("iloczyn="+iloczyn_hor(a,b)+"<br>"); 
document.write("kwadrat="+kwadrat_hor(a,b)+"<br>"); 
document.write("reszta z dzielenia="+reszta_z_dzielenia_hor(a,b)+"<br>"); 
</script> 
</div> 
</body> 
</html>
